name: CI

permissions:
  checks: write
  # For the coverage comment on pull requests.
  pull-requests: write

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Weekly, so that the end of life of a Node version is noticed without a push.
    - cron: "0 6 * * 1"

jobs:
  node-versions:
    name: Check Node versions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          # Use the latest release of the major version in .nvmrc, not an older one from the runner's cache.
          check-latest: true

      - name: Check engines.node, @types/node, .nvmrc, the ECMAScript edition and the end of life
        # On the weekly run, a near end of life fails the job, so that GitHub sends a notification.
        run: npm run node:check -- ${{ github.event_name == 'schedule' && '--strict' || '' }}

  build:
    name: Install, build and test
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          # Use the latest release of the major version in .nvmrc, not an older one from the runner's cache.
          check-latest: true
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run tests (coverage; JSON and JUnit via config)
        # coverage/ and test-results/ are created here; the reporters are configured in vitest.config.ts
        run: |
          mkdir -p test-results
          npm test -- --coverage

      - name: Publish JUnit test report to the job summary
        if: always() && hashFiles('test-results/vitest-junit.xml') != ''
        uses: dorny/test-reporter@v3
        with:
          name: Vitest
          report-title: Vitest
          path: test-results/vitest-junit.xml
          # Vitest writes JUnit XML in the format of jest-junit, which this parser reads.
          reporter: jest-junit

      # After the Vitest report, so that the coverage appears under its title. On pull requests
      # from this repository it also keeps one comment with the report up to date; pull requests
      # from forks get no write access, so they are left out.
      - name: Report coverage
        if: always() && hashFiles('coverage/coverage-summary.json') != ''
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          # The thresholds in the report come from this file.
          vite-config-path: vitest.config.ts
          comment-on: ${{ github.event.pull_request.head.repo.full_name == github.repository && 'pr' || 'none' }}
