name: CI

permissions:
  checks: write

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Weekly, so that the end of life of a Node version is noticed without a push.
    - cron: "0 6 * * 1"

jobs:
  node-versions:
    name: Check Node versions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          # Use the latest release of the major version in .nvmrc, not an older one from the runner's cache.
          check-latest: true

      - name: Check engines.node, @types/node, .nvmrc and the end of life
        # On the weekly run, a near end of life fails the job, so that GitHub sends a notification.
        run: npm run node:check -- ${{ github.event_name == 'schedule' && '--strict' || '' }}

  build:
    name: Install, build and test
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          # Use the latest release of the major version in .nvmrc, not an older one from the runner's cache.
          check-latest: true
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run tests (coverage + JSON; JUnit via config)
        # coverage/ and test-results/vitest-results.json are created here; JUnit is configured in vitest.config.mts
        run: |
          mkdir -p test-results
          npm test -- --coverage

      - name: Summarize coverage in job summary
        if: always()
        run: |
          node <<'EOF'
          const fs = require('fs');
          const p = 'coverage/coverage-summary.json';
          const out = process.env.GITHUB_STEP_SUMMARY;
          if (!out) { console.log('GITHUB_STEP_SUMMARY not set; skipping summary'); process.exit(0); }
          if (fs.existsSync(p)) {
            const d = JSON.parse(fs.readFileSync(p));
            let summary = '## Coverage report\n\n| Metric | % |\n|---|---|\n';
            for (const k in d.total) {
              summary += `| ${k} | ${d.total[k].pct}% |\n`;
            }
            fs.appendFileSync(out, summary);
          }
          EOF
          
      - name: Check if JUnit report exists
        if: always()
        id: junit-check
        shell: bash
        run: |
          if [[ -f "test-results/vitest-junit.xml" ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish JUnit test report to GitHub Checks
        if: always() && steps.junit-check.outputs.exists == 'true'
        uses: dorny/test-reporter@v3
        with:
          name: Vitest
          path: test-results/vitest-junit.xml
          reporter: jest-junit
